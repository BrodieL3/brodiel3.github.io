name: Refresh Instagram posts

on:
  schedule:
    # 09:17 UTC daily. Off-the-hour on purpose — GitHub's scheduler is
    # heavily contended at :00 and jobs there get delayed or dropped.
    - cron: "17 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-instagram
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # This workflow file is mirrored into BrodieL3/brodiel3.github.io — the
    # actual gurfc.com host — along with the rest of the site, and is meant
    # to run there: that's the live domain. It also still runs on this repo.
    # IG_ACCESS_TOKEN must be set as a repository secret on BOTH repos
    # independently (secrets don't travel with git push) or it'll fail on
    # whichever one is missing it.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Pull the newest posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/refresh-instagram.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ig-*.jpg script.js
          if git diff --cached --quiet; then
            echo "No new posts — nothing to commit."
          else
            git commit -m "Refresh Instagram posts"
            git push
          fi
